<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Itinerario, pagos y recomendaciones día por día del viaje a Iguazú y Brasil.">
<meta name="theme-color" content="#1C5A43" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11150F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Viaje">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  html,body{margin:0;}
  img{max-width:100%;}
  [hidden]{display:none!important;}
</style>
<title>Brújula Iguazú</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F1F3EE; --card:#FFFFFF; --card-2:#F7F8F4;
  --ink:#1A211C; --ink-soft:#5D6A61; --ink-faint:#8B968D;
  --line:#DDE2D8; --line-soft:#EAEEE6;
  --brand:#1C5A43; --brand-2:#2F8B66; 
  --clay:#AE4F2C; --clay-soft:#F6E7DF;
  --water:#2B6B8A; --gold:#9A7B18;
  --good:#2F7A4F; --good-soft:#E4F0E7;
  --shadow:rgba(26,43,33,.09);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#11150F; --card:#191E17; --card-2:#1F251D;
    --ink:#E9EEE4; --ink-soft:#A3AE9F; --ink-faint:#7B857A;
    --line:#2C332A; --line-soft:#232A21;
    --brand:#7FC9A3; --brand-2:#9BD9B8; --clay:#E58C63; --clay-soft:#37241C;
    --water:#7FBBD8; --gold:#D9BA57; --good:#8BD0A4; --good-soft:#1D2C22;
    --shadow:rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#11150F; --card:#191E17; --card-2:#1F251D;
  --ink:#E9EEE4; --ink-soft:#A3AE9F; --ink-faint:#7B857A;
  --line:#2C332A; --line-soft:#232A21;
  --brand:#7FC9A3; --brand-2:#9BD9B8; --clay:#E58C63; --clay-soft:#37241C;
  --water:#7FBBD8; --gold:#D9BA57; --good:#8BD0A4; --good-soft:#1D2C22;
  --shadow:rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;}
h1,h2,h3{margin:0;text-wrap:balance;}
button{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;}

/* —— Encabezado pegajoso —— */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);border-bottom:1px solid var(--line);}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px 0;}
.now-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.now-line .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);font-weight:600;}
.now-line .clock{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.82rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.days{display:flex;gap:6px;overflow-x:auto;padding:9px 0 10px;scrollbar-width:none;}
.days::-webkit-scrollbar{display:none;}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:.78rem;font-weight:600;color:var(--ink-soft);cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center;}
.chip .d{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;}
:root[data-theme="dark"] .chip[aria-pressed="true"],:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0E1410;}
.chip.is-today{border-color:var(--brand-2);box-shadow:inset 0 0 0 1px var(--brand-2);}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--clay);}

.wrap{max-width:760px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:18px;}

/* —— Cabecera del día —— */
.day-head{display:flex;flex-direction:column;gap:3px;}
.day-head .eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--brand);font-weight:700;}
.day-head h1{font-family:Fraunces,Georgia,serif;font-size:1.7rem;font-weight:700;letter-spacing:-.01em;}
.day-head .sub{color:var(--ink-soft);font-size:.9rem;}

/* —— Tarjeta AHORA —— */
.now-card{background:var(--brand);color:#fff;border-radius:16px;padding:16px 17px;box-shadow:0 8px 20px var(--shadow);display:flex;flex-direction:column;gap:5px;}
:root[data-theme="dark"] .now-card,:root:not([data-theme="light"]) .now-card{color:#0E1410;}
.now-card .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;opacity:.82;}
.now-card .t{font-family:"IBM Plex Mono",monospace;font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.now-card .n{font-size:1.02rem;font-weight:600;line-height:1.35;}
.now-card .m{font-size:.82rem;opacity:.85;}

/* —— Lista de actividades —— */
.sec-t{display:flex;align-items:center;gap:9px;font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);font-weight:700;}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line);}
.items{display:flex;flex-direction:column;gap:8px;}
.item{display:grid;grid-template-columns:62px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;}
.item.now{border-color:var(--brand-2);box-shadow:0 0 0 1px var(--brand-2), 0 6px 16px var(--shadow);}
.item.past{background:transparent;border-style:dashed;opacity:.62;}
.item .time{font-family:"IBM Plex Mono",monospace;font-size:.82rem;font-weight:600;color:var(--brand);font-variant-numeric:tabular-nums;line-height:1.35;}
.item .time span{display:block;color:var(--ink-faint);font-weight:500;}
.item.past .time{color:var(--ink-faint);}
.item .name{font-weight:600;line-height:1.35;}
.item .meta{font-size:.79rem;color:var(--ink-soft);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;}
.item .cost{font-family:"IBM Plex Mono",monospace;font-size:.8rem;font-weight:600;color:var(--clay);font-variant-numeric:tabular-nums;}
.item .cost.ok{color:var(--good);}
.cat{font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;border-radius:5px;padding:1px 6px;}
.cat.excursion{background:var(--good-soft);color:var(--good);}
.cat.traslado{background:color-mix(in srgb,var(--water) 14%,transparent);color:var(--water);}
.cat.comida{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);}
.cat.hospedaje{background:var(--clay-soft);color:var(--clay);}
.done-btn{margin-top:7px;border:1px solid var(--line);background:var(--card-2);border-radius:7px;padding:3px 9px;font-size:.72rem;font-weight:600;color:var(--ink-soft);cursor:pointer;}
.item.done .name{text-decoration:line-through;text-decoration-color:var(--ink-faint);}
.item.done .done-btn{background:var(--good-soft);color:var(--good);border-color:transparent;}

/* —— Plegables —— */
details.fold{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
details.fold>summary{cursor:pointer;list-style:none;padding:12px 14px;display:flex;align-items:center;gap:9px;font-weight:600;font-size:.9rem;}
details.fold>summary::-webkit-details-marker{display:none;}
details.fold>summary .car{color:var(--brand);font-size:.72rem;transition:transform .15s;}
details.fold[open]>summary .car{transform:rotate(90deg);}
details.fold>summary .count{margin-left:auto;font-size:.76rem;color:var(--ink-faint);font-weight:500;font-family:"IBM Plex Mono",monospace;}
.fold-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:9px;}

/* —— Pagos —— */
.pay{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.pay-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:13px 15px;background:var(--clay-soft);}
.pay-h .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--clay);}
.pay-h .amt{font-family:"IBM Plex Mono",monospace;font-size:1.2rem;font-weight:600;color:var(--clay);font-variant-numeric:tabular-nums;}
.pay-rows{display:flex;flex-direction:column;}
.pay-row{display:flex;justify-content:space-between;gap:12px;padding:9px 15px;border-top:1px solid var(--line-soft);font-size:.86rem;}
.pay-row span{min-width:0;}
.pay-row b{font-family:"IBM Plex Mono",monospace;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;}
.pay-row.paid{color:var(--ink-faint);}
.pay-row.paid b{color:var(--good);}
.pay-empty{padding:12px 15px;font-size:.86rem;color:var(--ink-soft);}

/* —— Recomendaciones —— */
.rec{display:flex;flex-direction:column;gap:6px;padding:11px 13px;background:var(--card-2);border:1px solid var(--line-soft);border-radius:10px;}
.rec h3{font-family:Fraunces,Georgia,serif;font-size:1rem;}
.rec .tag{align-self:flex-start;font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;border-radius:5px;padding:2px 7px;background:var(--good-soft);color:var(--good);}
.rec .tag.famoso{background:var(--clay-soft);color:var(--clay);}
.rec .tag.kilo{background:color-mix(in srgb,var(--water) 14%,transparent);color:var(--water);}
.rec .tag.barato{background:var(--card);color:var(--ink-soft);border:1px solid var(--line);}
.rec .price{font-family:"IBM Plex Mono",monospace;font-size:.8rem;font-weight:600;color:var(--brand);}
.rec .where{font-size:.78rem;color:var(--ink-soft);}
.rec p{margin:2px 0 0;font-size:.84rem;color:var(--ink-soft);}

/* —— Reservas —— */
.bk-group{font-size:.78rem;font-weight:700;color:var(--ink-soft);margin:6px 0 -2px;}
.bk{display:flex;flex-direction:column;gap:3px;padding:11px 13px;border-radius:10px;border:1px solid var(--line-soft);background:var(--card-2);border-left:4px solid var(--ink-faint);}
.bk.ya{border-left-color:var(--clay);background:var(--clay-soft);}
.bk.semana{border-left-color:var(--gold);}
.bk.lugar{border-left-color:var(--water);}
.bk.listo{border-left-color:var(--good);opacity:.78;}
.bk .n{font-weight:700;font-size:.92rem;}
.bk .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--ink-soft);}
.bk .meta b{font-family:"IBM Plex Mono",monospace;color:var(--brand);font-variant-numeric:tabular-nums;}
.bk p{margin:3px 0 0;font-size:.82rem;color:var(--ink-soft);line-height:1.45;}

/* —— Pie —— */
.foot{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-wrap:wrap;gap:12px 24px;}
.stat .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);font-weight:700;}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:1.05rem;font-weight:600;font-variant-numeric:tabular-nums;}
.stat .v.due{color:var(--clay);}
.stat .v.ok{color:var(--good);}
.note{font-size:.78rem;color:var(--ink-faint);}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="now-line">
      <span class="lbl" id="nowLbl">Viaje Iguazú · Brasil</span>
      <span class="clock" id="clock"></span>
    </div>
    <div class="days" id="days"></div>
  </div>
</header>

<main class="wrap">
  <div class="day-head">
    <div class="eyebrow" id="dayEyebrow"></div>
    <h1 id="dayTitle"></h1>
    <div class="sub" id="daySub"></div>
  </div>

  <section class="now-card" id="nowCard" hidden>
    <span class="k" id="nowK">Lo que sigue</span>
    <span class="t" id="nowT"></span>
    <span class="n" id="nowN"></span>
    <span class="m" id="nowM"></span>
  </section>

  <section>
    <div class="sec-t" id="planLbl">Plan del día</div>
    <div class="items" id="items" style="margin-top:10px"></div>
    <details class="fold" id="pastFold" hidden style="margin-top:8px">
      <summary><span class="car">▸</span> Ya pasó <span class="count" id="pastCount"></span></summary>
      <div class="fold-body items" id="pastItems"></div>
    </details>
  </section>

  <section class="pay">
    <div class="pay-h"><span class="lbl">Falta pagar hoy</span><span class="amt" id="dayDue"></span></div>
    <div class="pay-rows" id="payRows"></div>
  </section>

  <details class="fold" id="bookFold">
    <summary><span class="car">▸</span> Reservar con tiempo <span class="count" id="bookCount"></span></summary>
    <div class="fold-body" id="bookBody"></div>
  </details>

  <details class="fold" id="recFold">
    <summary><span class="car">▸</span> Dónde comer y recomendaciones <span class="count" id="recCount"></span></summary>
    <div class="fold-body" id="recBody"></div>
  </details>

  <div class="foot">
    <div class="stat"><div class="k">Falta pagar en todo el viaje</div><div class="v due" id="tripDue"></div></div>
    <div class="stat"><div class="k">Ya pagado</div><div class="v ok" id="tripPaid"></div></div>
    <div class="stat"><div class="k">Total</div><div class="v" id="tripTotal"></div></div>
  </div>
  <p class="note" id="footNote"></p>
</main>

const YEAR = 2026;
const fmt = n => '$' + Math.round(n||0).toLocaleString('es-AR');
const pad = n => String(n).padStart(2,'0');

// —— Fechas del viaje ——
function dayDate(d){ const [dd,mm] = d.date.split('/').map(Number); return new Date(YEAR, mm-1, dd); }
const DAYS = DATA.schedule.map((d,i) => ({...d, i, js: dayDate(d)}));
const WD = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MO = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

// —— Horarios ——
function mins(t){ const m = String(t).match(/(\d{1,2}):(\d{2})/); return m ? +m[1]*60 + +m[2] : null; }
function range(t){
  const m = String(t).match(/(\d{1,2}):(\d{2})\s*[–-]\s*(\d{1,2}):(\d{2})/);
  if(m){ const a = +m[1]*60 + +m[2]; let b = +m[3]*60 + +m[4]; if(b < a) b += 1440; return [a,b]; }
  const s = mins(t); return s === null ? [null,null] : [s, s+60];
}
const MEALS = ['desayuno','almuerzo','merienda','cena','hospedaje'];
const mealOf = (d,k) => { const v = d.meals && d.meals[k]; return (v && typeof v === 'object') ? v : {place:v||'', price:0}; };
const priceOf = it => Number(it[5]) || 0;
const paidOf = it => it[7] === true;

// —— Totales ——
function dayPay(d){
  let due = 0, paid = 0;
  d.items.forEach(it => { const p = priceOf(it); paidOf(it) ? paid += p : due += p; });
  MEALS.forEach(k => { const v = mealOf(d,k), p = Number(v.price)||0; v.paid ? paid += p : due += p; });
  return {due, paid};
}
const TRIP = DAYS.reduce((a,d) => { const p = dayPay(d); a.due += p.due; a.paid += p.paid; return a; }, {due:0, paid:0});

// —— Ciudad → recomendaciones de comida ——
const CITY_BY_DATE = {'29/9':0,'30/9':0,'1/10':1,'2/10':1,'3/10':1,'4/10':2,'13/10':2,'5/10':3,'6/10':4,'7/10':4,'8/10':4,'9/10':5,'10/10':5,'11/10':5,'12/10':5};

// —— Estado ——
let sel = 0, ticker = null;
function todayIdx(now){
  const t = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const i = DAYS.findIndex(d => d.js.getTime() === t);
  if(i >= 0) return i;
  return now < DAYS[0].js ? -1 : DAYS.length;   // antes del viaje / después
}
function localGet(k){ try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch(e){ return []; } }
function localSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
let doneList = localGet('viaje-hechos');
const keyOf = (di,ii) => di + ':' + ii;
const isDone = (di,ii) => doneList.includes(keyOf(di,ii));

function itemCard(d, it, ii, state){
  const [a,b] = range(it[0]);
  const el = document.createElement('div');
  const done = isDone(d.i, ii);
  el.className = 'item' + (state === 'now' ? ' now' : state === 'past' ? ' past' : '') + (done ? ' done' : '');
  const price = priceOf(it);
  const t2 = (a !== null && b !== null && /[–-]/.test(String(it[0]))) ? '<span>' + pad(Math.floor((b%1440)/60)) + ':' + pad(b%60) + '</span>' : '';
  el.innerHTML =
    '<div class="time">' + (a === null ? '—' : pad(Math.floor(a/60)) + ':' + pad(a%60)) + t2 + '</div>' +
    '<div><div class="name"></div>' +
    '<div class="meta"><span class="cat ' + (it[6]||'traslado') + '">' + (it[6]||'traslado') + '</span>' +
    (it[3] ? '<span class="tr"></span>' : '') +
    (price ? '<span class="cost' + (paidOf(it) ? ' ok' : '') + '">' + (paidOf(it) ? '✓ ' : '') + fmt(price) + '</span>' : '') +
    '</div>' +
    '<button class="done-btn" type="button">' + (done ? '✓ hecho' : 'marcar hecho') + '</button></div>';
  el.querySelector('.name').textContent = String(it[1]).replace(/<[^>]+>/g,'');
  const tr = el.querySelector('.tr'); if(tr) tr.textContent = String(it[3]).replace(/<[^>]+>/g,'');
  el.querySelector('.done-btn').addEventListener('click', () => {
    const k = keyOf(d.i, ii);
    doneList = doneList.includes(k) ? doneList.filter(x => x !== k) : doneList.concat([k]);
    localSet('viaje-hechos', doneList);
    render();
  });
  return el;
}

function render(){
  const now = new Date();
  const ti = todayIdx(now);
  const d = DAYS[sel];
  const isToday = sel === ti;
  const cur = now.getHours()*60 + now.getMinutes();

  document.getElementById('clock').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
  document.getElementById('nowLbl').textContent = ti === -1
    ? 'Faltan ' + Math.ceil((DAYS[0].js - now)/86400000) + ' días'
    : ti >= DAYS.length ? 'Viaje terminado' : 'Día ' + (ti+1) + ' de ' + DAYS.length;

  // Chips
  const days = document.getElementById('days');
  days.innerHTML = '';
  DAYS.forEach((x,i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (i === ti ? ' is-today' : '');
    b.setAttribute('aria-pressed', i === sel ? 'true' : 'false');
    const p = dayPay(x);
    b.innerHTML = '<span class="d">' + x.date + '</span>' + (p.due > 0 ? '<span class="dot"></span>' : '');
    b.addEventListener('click', () => { sel = i; render(); document.getElementById('days').children[i].scrollIntoView({block:'nearest', inline:'center'}); });
    days.appendChild(b);
  });
  const chip = days.children[sel];
  if(chip) chip.scrollIntoView({block:'nearest', inline:'center'});

  // Cabecera
  document.getElementById('dayEyebrow').textContent = (isToday ? 'Hoy · ' : '') + 'Día ' + (sel+1) + ' de ' + DAYS.length;
  document.getElementById('dayTitle').textContent = WD[d.js.getDay()] + ' ' + d.js.getDate() + ' de ' + MO[d.js.getMonth()];
  document.getElementById('daySub').textContent = d.night;

  // Ordenar: lo que viene primero, lo pasado al final
  const rows = d.items.map((it,ii) => ({it, ii, r: range(it[0])}))
    .sort((x,y) => (x.r[0] === null) - (y.r[0] === null) || (x.r[0]||0) - (y.r[0]||0) || x.ii - y.ii);
  const upcoming = [], past = [];
  let nowRow = null, nextRow = null;
  rows.forEach(row => {
    const [a,b] = row.r;
    if(isToday && a !== null && b !== null){
      if(cur >= b){ past.push(row); return; }
      if(cur >= a && cur < b) nowRow = row;
      else if(!nextRow && a > cur) nextRow = row;
    }
    upcoming.push(row);
  });

  const box = document.getElementById('items'); box.innerHTML = '';
  upcoming.forEach(row => box.appendChild(itemCard(d, row.it, row.ii, row === nowRow ? 'now' : '')));
  if(!upcoming.length) box.innerHTML = '<p class="pay-empty">Todo lo del día ya pasó. Mirá el día siguiente.</p>';

  const fold = document.getElementById('pastFold');
  fold.hidden = past.length === 0;
  document.getElementById('pastCount').textContent = past.length + (past.length === 1 ? ' actividad' : ' actividades');
  const pbox = document.getElementById('pastItems'); pbox.innerHTML = '';
  past.forEach(row => pbox.appendChild(itemCard(d, row.it, row.ii, 'past')));
  document.getElementById('planLbl').textContent = isToday ? 'Lo que queda del día' : 'Plan del día';

  // Tarjeta AHORA
  const card = document.getElementById('nowCard');
  const target = nowRow || nextRow;
  if(isToday && target){
    card.hidden = false;
    document.getElementById('nowK').textContent = nowRow ? 'Ahora' : 'Lo que sigue';
    document.getElementById('nowT').textContent = String(target.it[0]);
    document.getElementById('nowN').textContent = String(target.it[1]).replace(/<[^>]+>/g,'');
    const falta = target.r[0] - cur;
    document.getElementById('nowM').textContent = nowRow
      ? 'Termina en ' + (target.r[1] - cur) + ' min · ' + String(target.it[3]).replace(/<[^>]+>/g,'')
      : (falta > 90 ? 'En ' + Math.floor(falta/60) + ' h ' + (falta%60) + ' min' : 'En ' + falta + ' min') + ' · ' + String(target.it[3]).replace(/<[^>]+>/g,'');
  } else if(isToday){
    card.hidden = false;
    document.getElementById('nowK').textContent = 'Hoy';
    document.getElementById('nowT').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
    document.getElementById('nowN').textContent = 'No queda nada agendado';
    document.getElementById('nowM').textContent = d.night;
  } else card.hidden = true;

  // Pagos del día
  const p = dayPay(d);
  document.getElementById('dayDue').textContent = fmt(p.due);
  const pr = document.getElementById('payRows'); pr.innerHTML = '';
  const add = (name, price, paid) => {
    const r = document.createElement('div');
    r.className = 'pay-row' + (paid ? ' paid' : '');
    r.innerHTML = '<span></span><b>' + (paid ? '✓ ' : '') + fmt(price) + '</b>';
    r.querySelector('span').textContent = name.replace(/<[^>]+>/g,'');
    pr.appendChild(r);
  };
  let any = false;
  d.items.forEach(it => { if(priceOf(it) > 0){ any = true; add(it[1], priceOf(it), paidOf(it)); } });
  MEALS.forEach(k => { const v = mealOf(d,k); if(Number(v.price) > 0){ any = true; add((v.place || k) + (k === 'hospedaje' ? '' : ' · ' + k), Number(v.price), !!v.paid); } });
  if(!any) pr.innerHTML = '<p class="pay-empty">No hay nada para pagar este día.</p>';

  // Recomendaciones
  const ci = CITY_BY_DATE[d.date];
  const rec = document.getElementById('recBody'); rec.innerHTML = '';
  const g = ci === undefined ? null : DATA.food[ci];
  document.getElementById('recCount').textContent = g ? g.items.length + ' lugares' : 'consejos';
  if(g){
    if(g.note){ const n = document.createElement('p'); n.className = 'note'; n.textContent = g.note.replace(/<[^>]+>/g,''); rec.appendChild(n); }
    g.items.forEach(item => {
      const c = document.createElement('div');
      c.className = 'rec';
      c.innerHTML = '<span class="tag ' + item.tag + '">' + ({libre:'Tenedor libre', kilo:'Por kilo', famoso:'Imperdible', barato:'Barato'}[item.tag] || item.tag) + '</span>' +
        '<h3></h3><div class="price"></div><div class="where"></div><p></p>';
      c.querySelector('h3').textContent = item.n;
      c.querySelector('.price').textContent = item.p;
      c.querySelector('.where').textContent = '📍 ' + item.d;
      c.querySelector('p').textContent = item.w.replace(/<[^>]+>/g,'');
      rec.appendChild(c);
    });
  }
  DATA.tips.forEach(t => {
    const c = document.createElement('div');
    c.className = 'rec';
    c.innerHTML = '<h3></h3><p></p>';
    c.querySelector('h3').textContent = t[0];
    c.querySelector('p').textContent = t[1];
    rec.appendChild(c);
  });

  // Reservas
  const bb = document.getElementById('bookBody');
  if(bb && !bb.dataset.done && DATA.bookings){
    const urg = (DATA.bookings.find(g => g.estado === 'ya') || {items:[]}).items.length;
    document.getElementById('bookCount').textContent = urg + ' urgentes';
    DATA.bookings.forEach(g => {
      const h = document.createElement('p');
      h.className = 'bk-group';
      h.textContent = g.grupo;
      bb.appendChild(h);
      g.items.forEach(b => {
        const c = document.createElement('div');
        c.className = 'bk ' + g.estado;
        c.innerHTML = '<span class="n"></span><span class="meta"><span class="cu"></span><b></b></span><p></p>';
        c.querySelector('.n').textContent = b.n;
        c.querySelector('.cu').textContent = b.d;
        c.querySelector('b').textContent = b.p;
        c.querySelector('p').textContent = b.w.replace(/<[^>]+>/g,'');
        bb.appendChild(c);
      });
    });
    bb.dataset.done = '1';
  }

  document.getElementById('tripDue').textContent = fmt(TRIP.due);
  document.getElementById('tripPaid').textContent = fmt(TRIP.paid);
  document.getElementById('tripTotal').textContent = fmt(TRIP.due + TRIP.paid);
  document.getElementById('footNote').textContent = 'Los horarios son los del itinerario y las marcas de "hecho" quedan en este teléfono. Los precios están en pesos argentinos.';
}

const start = new Date();
sel = Math.max(0, Math.min(DAYS.length - 1, todayIdx(start) === -1 ? 0 : todayIdx(start)));
render();
ticker = setInterval(render, 60000);
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
